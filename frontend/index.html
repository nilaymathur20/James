    <!-- Analytics: privacy-friendly, local-only (no external calls) -->
    <script>
      // Minimal analytics: tracks page views locally, no external calls
      (function() {
        const data = {
          page: window.location.pathname,
          referrer: document.referrer || 'direct',
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent,
          screenSize: `${window.innerWidth}x${window.innerHeight}`,
        };
        // Store in localStorage for local insights only
        const events = JSON.parse(localStorage.getItem('james_analytics') || '[]');
        events.push(data);
        // Keep only last 100 events
        if (events.length > 100) events.shift();
        localStorage.setItem('james_analytics', JSON.stringify(events));
      })();
    </script>

    <title>James · Local-first AI Assistant</title>

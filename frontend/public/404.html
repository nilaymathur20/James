<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — James</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #10151e;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 480px; }
        h1 { font-size: 4rem; font-weight: 700; color: #58a6ff; margin-bottom: 1rem; }
        h2 { font-size: 1.25rem; font-weight: 600; color: #fff; margin-bottom: 0.75rem; }
        p { color: #8b949e; margin-bottom: 1.5rem; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, #557ee2, #7158c9);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        a:hover { transform: translateY(-1px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">Back to James</a>
    </div>
</body>
</html>
